<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공시용 영단어장</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">
    <!-- 앱 렌더링 컨테이너 -->
    <div id="app" class="min-h-screen pb-10"></div>

    <script>
        // 1. 상태 관리 (State)
        let vocabData = [];
        let scores = JSON.parse(localStorage.getItem('vocabScores') || '{}');
        
        let state = {
            activeTab: 'list', // 'list' | 'test'
            viewState: 'menu', // 'menu' | 'studying' | 'testing' | 'testResult'
            selectedChapter: null,
            test: {
                questions: [],
                currentIndex: 0,
                score: 0,
                isAnswered: false,
                isWrong: false,
                inputValue: ''
            }
        };

        // 2. 초기 데이터 로드 (vocab_data.json)
        async function init() {
            try {
                renderLoading();
                const response = await fetch('vocab_data.json');
                if (!response.ok) throw new Error('데이터 로드 실패');
                vocabData = await response.json();
                render();
            } catch (error) {
                console.error(error);
                document.getElementById('app').innerHTML = `
                    <div class="text-center py-20 text-red-500 font-bold">
                        데이터를 불러오는데 실패했습니다.<br>
                        (로컬에서 직접 실행 시 브라우저 보안 정책(CORS)으로 인해 차단될 수 있습니다. 로컬 서버나 Vercel을 이용해주세요.)
                    </div>
                `;
            }
        }

        // 3. 발음 듣기 기능 (TTS)
        window.speak = function(word) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                window.speechSynthesis.speak(utterance);
            } else {
                alert('이 브라우저는 음성 합성을 지원하지 않습니다.');
            }
        };

        // 4. 이벤트 핸들러
        window.changeTab = function(tab) {
            state.activeTab = tab;
            state.viewState = 'menu';
            state.selectedChapter = null;
            render();
        };

        window.selectChapter = function(chapterIndex) {
            state.selectedChapter = vocabData[chapterIndex];
            if (state.activeTab === 'list') {
                state.viewState = 'studying';
            } else {
                startTest(state.selectedChapter);
            }
            render();
        };

        window.goBackToMenu = function() {
            state.viewState = 'menu';
            state.selectedChapter = null;
            render();
        };

        // 배열 섞기 유틸리티
        function shuffleArray(array) {
            const newArr = [...array];
            for (let i = newArr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
            }
            return newArr;
        }

        function startTest(chapterData) {
            const randomizedWords = shuffleArray(chapterData.words);
            const questions = randomizedWords.map(wordObj => ({
                ...wordObj,
                askType: Math.random() > 0.5 ? 'ask_meaning' : 'ask_word'
            }));

            state.test = {
                questions: questions,
                currentIndex: 0,
                score: 0,
                isAnswered: false,
                isWrong: false,
                inputValue: ''
            };
            state.viewState = 'testing';
        }

        // 💡 [요청하신 정규화 함수 추가] - 조사 및 공백 예외 처리
        function normalizeText(text) {
            return text
                .trim()
                .toLowerCase()
                .replace(/~\s*를/g, "~을") // '~를' 또는 '~ 를'을 모두 '~을'로 변환
                .replace(/~\s*은/g, "~은") // '~는'을 '~은'으로 변환 (필요 시)
                .replace(/~\s*는/g, "~은")
                .replace(/~\s*와/g, "~과") // '~와'를 '~과'로 변환 (필요 시)
                .replace(/~\s*과/g, "~과");
        }

        window.submitAnswer = function(event) {
            event.preventDefault();
            const inputEl = document.getElementById('answerInput');
            const inputValue = inputEl.value;
            if (!inputValue.trim()) return;

            const currentQ = state.test.questions[state.test.currentIndex];
            const cleanInput = normalizeText(inputValue);
            let isCorrect = false;

            // 정답 비교 로직
            if (currentQ.askType === 'ask_meaning') {
                // 뜻 맞추기: 여러 뜻 중 하나라도 일치하면 정답 (데이터도 정규화 후 비교)
                isCorrect = currentQ.meanings.some(
                    meaning => normalizeText(meaning) === cleanInput
                );
            } else {
                // 단어 맞추기
                isCorrect = normalizeText(currentQ.word) === cleanInput;
            }

            if (isCorrect) {
                state.test.isAnswered = true;
                state.test.isWrong = false;
                state.test.score += 1;
            } else {
                state.test.isWrong = true;
                inputEl.value = ''; // 오답 시 비우기
                setTimeout(() => inputEl.focus(), 10);
            }
            render();
        };

        window.nextQuestion = function() {
            if (state.test.currentIndex + 1 < state.test.questions.length) {
                state.test.currentIndex += 1;
                state.test.isAnswered = false;
                state.test.isWrong = false;
                render();
            } else {
                // 테스트 종료 및 점수 저장
                scores[state.selectedChapter.chapter] = state.test.score;
                localStorage.setItem('vocabScores', JSON.stringify(scores));
                state.viewState = 'testResult';
                render();
            }
        };

        // 5. 렌더링 로직 (화면 그리기)
        function renderLoading() {
            document.getElementById('app').innerHTML = `
                <div class="flex items-center justify-center h-screen text-xl font-bold text-gray-500 animate-pulse">
                    데이터를 불러오는 중입니다...
                </div>
            `;
        }

        function render() {
            const app = document.getElementById('app');
            let html = `
                <!-- 헤더 및 탭 네비게이션 -->
                <div class="bg-white shadow-sm mb-6 sticky top-0 z-10">
                    <div class="max-w-2xl mx-auto">
                        <h1 class="text-2xl font-bold text-center py-4 text-blue-600">나만의 영단어장</h1>
                        <div class="flex border-t">
                            <button onclick="changeTab('list')" class="flex-1 py-3 text-center font-semibold transition-colors ${state.activeTab === 'list' ? 'bg-blue-50 text-blue-600 border-b-2 border-blue-600' : 'text-gray-500 hover:bg-gray-50'}">
                                리스트 탭
                            </button>
                            <button onclick="changeTab('test')" class="flex-1 py-3 text-center font-semibold transition-colors ${state.activeTab === 'test' ? 'bg-blue-50 text-blue-600 border-b-2 border-blue-600' : 'text-gray-500 hover:bg-gray-50'}">
                                테스트 탭
                            </button>
                        </div>
                    </div>
                </div>
                <div class="max-w-2xl mx-auto px-4">
            `;

            // === 메뉴 화면 ===
            if (state.viewState === 'menu') {
                html += `<h2 class="text-xl font-bold mb-4">${state.activeTab === 'list' ? '학습할 회차를 선택하세요' : '테스트할 회차를 선택하세요'}</h2>`;
                html += `<div class="grid gap-3">`;
                
                vocabData.forEach((data, index) => {
                    const totalWords = data.words.length;
                    const bestScore = scores[data.chapter];
                    let badgeText = state.activeTab === 'list' ? `${totalWords}개` : (bestScore !== undefined ? `${bestScore}개 / ${totalWords}개` : `${totalWords}개`);
                    
                    html += `
                        <button onclick="selectChapter(${index})" class="flex items-center justify-between p-4 bg-white border border-gray-200 rounded-lg shadow-sm hover:shadow-md hover:border-blue-400 transition-all text-left group">
                            <span class="text-lg font-bold text-gray-800 group-hover:text-blue-600 transition-colors">${data.chapter}회</span>
                            <span class="text-sm font-medium text-gray-500 bg-gray-100 px-3 py-1 rounded-full">${badgeText}</span>
                        </button>
                    `;
                });
                html += `</div>`;
            }

            // === 단어 학습 화면 ===
            if (state.viewState === 'studying' && state.selectedChapter) {
                html += `
                    <div class="animate-fade-in">
                        <div class="flex items-center justify-between mb-6">
                            <h2 class="text-2xl font-bold">${state.selectedChapter.chapter}회 단어 리스트</h2>
                            <button onclick="goBackToMenu()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300">나가기</button>
                        </div>
                        <div class="space-y-4">
                `;
                
                state.selectedChapter.words.forEach(wordObj => {
                    // note(설명)가 있는 경우 표시할 HTML
                    const noteHtml = wordObj.note ? `<p class="text-sm text-gray-500 bg-gray-50 p-2 rounded mt-2">💡 ${wordObj.note}</p>` : '';
                    
                    html += `
                        <div class="bg-white p-5 rounded-lg shadow-sm border border-gray-100">
                            <div class="flex items-center gap-3 mb-2">
                                <span class="text-2xl font-bold text-blue-600 cursor-pointer hover:text-blue-800" onclick="speak('${wordObj.word}')" title="발음 듣기">${wordObj.word} 🔊</span>
                            </div>
                            <p class="text-lg text-gray-800">${wordObj.meanings.join(', ')}</p>
                            ${noteHtml}
                        </div>
                    `;
                });
                
                html += `</div></div>`;
            }

            // === 테스트 진행 화면 ===
            if (state.viewState === 'testing') {
                const currentQ = state.test.questions[state.test.currentIndex];
                const totalQ = state.test.questions.length;
                
                html += `
                    <div class="max-w-md mx-auto mt-10">
                        <div class="flex items-center justify-between mb-6">
                            <span class="text-gray-500 font-medium">문제 ${state.test.currentIndex + 1} / ${totalQ}</span>
                            <button onclick="goBackToMenu()" class="text-sm text-gray-500 hover:text-gray-800 underline">테스트 중단</button>
                        </div>
                        <div class="bg-white p-8 rounded-xl shadow-md border border-gray-100 text-center relative overflow-hidden min-h-[350px]">
                `;

                if (!state.test.isAnswered) {
                    // 문제 풀기 상태
                    const questionText = currentQ.askType === 'ask_meaning' 
                        ? `<h3 class="text-4xl font-bold cursor-pointer hover:text-blue-600" onclick="speak('${currentQ.word}')">${currentQ.word} 🔊</h3>`
                        : `<h3 class="text-2xl font-bold text-gray-800 break-keep">${currentQ.meanings.join(', ')}</h3>`;
                    
                    const instruction = currentQ.askType === 'ask_meaning' ? '다음 단어의 뜻을 입력하세요' : '다음 뜻을 가진 단어를 입력하세요';

                    html += `
                        <form onsubmit="submitAnswer(event)" class="space-y-6 flex flex-col h-full justify-between">
                            <div class="flex flex-col items-center justify-center flex-grow pt-4">
                                <p class="text-sm text-blue-500 font-semibold mb-4">${instruction}</p>
                                ${questionText}
                            </div>
                            <div class="mt-8">
                                <input id="answerInput" type="text" autocomplete="off" class="w-full px-4 py-3 border-2 rounded-lg text-lg text-center outline-none transition-colors ${state.test.isWrong ? 'border-red-400 bg-red-50' : 'border-gray-300 focus:border-blue-500'}" placeholder="정답 입력 후 엔터">
                                ${state.test.isWrong ? `<p class="text-red-500 text-sm mt-2 font-medium">오답입니다. 다시 시도해보세요!</p>` : ''}
                            </div>
                            <button type="submit" class="w-full py-3 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 mt-4">확인</button>
                        </form>
                    `;
                } else {
                    // 정답 맞춘 상태
                    const noteHtml = currentQ.note ? `<div class="border-t border-green-200 pt-3 mt-3"><p class="text-sm text-gray-600">💡 ${currentQ.note}</p></div>` : '';
                    
                    html += `
                        <div class="space-y-6 animate-fade-in flex flex-col h-full">
                            <div class="absolute top-0 left-0 w-full h-2 bg-green-500"></div>
                            <h3 class="text-2xl font-bold text-green-600 mt-2 mb-4">🎉 정답입니다!</h3>
                            
                            <div class="bg-green-50 p-6 rounded-lg text-left flex-grow">
                                <span class="text-3xl font-bold text-gray-900 cursor-pointer block mb-2" onclick="speak('${currentQ.word}')">${currentQ.word} 🔊</span>
                                <p class="text-xl text-gray-800 font-medium mb-3">${currentQ.meanings.join(', ')}</p>
                                ${noteHtml}
                            </div>
                            <button onclick="nextQuestion()" class="w-full py-3 bg-gray-800 text-white font-bold rounded-lg hover:bg-gray-900 mt-4 shadow-lg">
                                ${state.test.currentIndex + 1 === totalQ ? '테스트 결과 보기' : '다음 문제'}
                            </button>
                        </div>
                    `;
                }
                html += `</div></div>`;
            }

            // === 테스트 결과 화면 ===
            if (state.viewState === 'testResult') {
                const totalQ = state.test.questions.length;
                const isPerfect = state.test.score === totalQ;
                
                html += `
                    <div class="max-w-md mx-auto mt-10 text-center bg-white p-8 rounded-xl shadow-md border border-gray-100 animate-fade-in">
                        <h2 class="text-3xl font-bold mb-2">테스트 완료!</h2>
                        <p class="text-gray-500 mb-8">${state.selectedChapter.chapter}회 단어 테스트 결과</p>
                        
                        <div class="text-6xl font-black text-blue-600 mb-8">
                            ${state.test.score} <span class="text-3xl text-gray-400 font-medium">/ ${totalQ}</span>
                        </div>
                        
                        <p class="text-lg text-gray-700 mb-8">
                            ${isPerfect ? '완벽합니다! 모든 단어를 외우셨네요! 👏' : '수고하셨습니다. 계속 복습해 보세요! 💪'}
                        </p>
                        <button onclick="goBackToMenu()" class="w-full py-4 bg-gray-200 text-gray-800 font-bold rounded-lg hover:bg-gray-300">
                            나가기 (테스트 탭으로)
                        </button>
                    </div>
                `;
            }

            html += `</div>`;
            app.innerHTML = html;

            // 렌더링 후 필요한 포커스 처리
            if (state.viewState === 'testing' && !state.test.isAnswered) {
                const input = document.getElementById('answerInput');
                if (input) input.focus();
            }
        }

        // 앱 시작
        init();

    </script>
</body>
</html>
